name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp
          POSTGRES_DB: cdp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cdp:cdp@localhost:5432/cdp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mini-cdp .
      - run: docker build -t mini-cdp-frontend frontend
