services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cdp
      POSTGRES_PASSWORD: cdp
      POSTGRES_DB: cdp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cdp:cdp@db:5432/cdp
      TEST_DATABASE_URL: postgresql+psycopg://cdp:cdp@db:5432/cdp_test
      # Development defaults. A real deployment must set its own values.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying}
      API_KEY: ${API_KEY:-dev-api-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
